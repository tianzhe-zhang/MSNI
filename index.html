<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="description" content="Marginally Strictly Negative Imaginary Systems, International Journal of Robust and Nonlinear Control, 2026.">
<title>MSNI Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@600&display=swap">
<style>
/* One paper, shown page by page as vector images; a single button in the top bar downloads the PDF. */
:root {
  --rule: #e2dce9;
  --accent: #660099;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: only light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #ffffff;
  color: #1c1922;
  font-family: var(--body);
  line-height: 1.5;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.col {
  max-width: 52rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #ffffff;
  border-bottom: 1px solid var(--rule);
}
.bar .col {
  display: flex;
  justify-content: flex-end;
  padding-block: .5rem;
}
.download {
  display: inline-block;
  padding: .45rem 1rem;
  border-radius: 10px;
  background: var(--accent);
  color: #ffffff;
  font-weight: 600;
  font-size: .95rem;
  line-height: 1.3;
  text-decoration: none;
}
.download:hover { background: #52007a; }
.download:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.pages {
  display: grid;
  gap: 1rem;
  padding-block: 1rem 3rem;
}
.pages img {
  display: block;
  width: 100%;
  height: auto;
  background: #ffffff;
  border: 1px solid var(--rule);
  border-radius: 4px;
}
</style>
</head>
<body>
<h1 class="sr-only">Marginally Strictly Negative Imaginary Systems (International Journal of Robust and Nonlinear Control, 2026)</h1>

<div class="bar">
  <div class="col">
    <a class="download" href="pdf/ijrnc2026.pdf" download="Zhang_Chen_Lanzon_Khong_IJRNC2026.pdf">Download PDF</a>
  </div>
</div>

<main class="col">
  <div class="pages">
    <img src="pages/ijrnc-1.svg" width="595" height="782" alt="Page 1 of 9" fetchpriority="high">
    <img src="pages/ijrnc-2.svg" width="595" height="782" alt="Page 2 of 9" loading="lazy" decoding="async">
    <img src="pages/ijrnc-3.svg" width="595" height="782" alt="Page 3 of 9" loading="lazy" decoding="async">
    <img src="pages/ijrnc-4.svg" width="595" height="782" alt="Page 4 of 9" loading="lazy" decoding="async">
    <img src="pages/ijrnc-5.svg" width="595" height="782" alt="Page 5 of 9" loading="lazy" decoding="async">
    <img src="pages/ijrnc-6.svg" width="595" height="782" alt="Page 6 of 9" loading="lazy" decoding="async">
    <img src="pages/ijrnc-7.svg" width="595" height="782" alt="Page 7 of 9" loading="lazy" decoding="async">
    <img src="pages/ijrnc-8.svg" width="595" height="782" alt="Page 8 of 9" loading="lazy" decoding="async">
    <img src="pages/ijrnc-9.svg" width="595" height="782" alt="Page 9 of 9" loading="lazy" decoding="async">
  </div>
</main>
</body>
</html>
